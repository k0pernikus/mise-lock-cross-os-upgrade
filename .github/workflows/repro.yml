name: cross-os lock upgrade

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  bump-on-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.4
        with:
          version: 2026.10.19
          install: false
          cache: false
      - name: mise version
        run: mise --version
      - name: mise upgrade --bump
        run: mise upgrade --bump
      - name: lock and config diff against the committed seed
        run: git diff -- mise.toml mise.lock
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bumped-on-windows
          path: |
            mise.toml
            mise.lock

  install-on-linux-the-windows-lock:
    needs: bump-on-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: bumped-on-windows
          path: .
      - name: stage the downloaded files as the baseline
        run: git add mise.toml mise.lock
      - uses: jdx/mise-action@v5.2.4
        with:
          version: 2026.10.19
          install: false
          cache: false
      - name: mise install --locked
        run: mise install --locked
      - name: mise install
        if: ${{ !cancelled() }}
        run: mise install
      - name: lock unchanged by mise install
        if: ${{ !cancelled() }}
        run: git diff --exit-code -- mise.toml mise.lock

  bump-on-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.4
        with:
          version: 2026.10.19
          install: false
          cache: false
      - name: mise version
        run: mise --version
      - name: mise upgrade --bump
        run: mise upgrade --bump
      - name: lock and config diff against the committed seed
        run: git diff -- mise.toml mise.lock
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bumped-on-linux
          path: |
            mise.toml
            mise.lock

  install-on-windows-the-linux-lock:
    needs: bump-on-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: bumped-on-linux
          path: .
      - name: stage the downloaded files as the baseline
        run: git add mise.toml mise.lock
      - uses: jdx/mise-action@v5.2.4
        with:
          version: 2026.10.19
          install: false
          cache: false
      - name: mise install --locked
        run: mise install --locked
      - name: mise install
        if: ${{ !cancelled() }}
        run: mise install
      - name: lock unchanged by mise install
        if: ${{ !cancelled() }}
        run: git diff --exit-code -- mise.toml mise.lock
