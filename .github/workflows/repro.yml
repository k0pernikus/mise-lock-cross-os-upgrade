name: mise install on Linux and Windows, mise upgrade --bump on Windows

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  linux-install-locked:
    name: "1. Linux: mise install --locked (outdated hk, committed lock)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.4
        with:
          version: 2026.10.19
          install: false
          cache: false
      - name: mise install --locked
        run: mise install --locked
      - name: installed hk version
        run: mise exec -- hk --version

  windows-install-locked:
    name: "2. Windows: mise install --locked (same committed lock)"
    needs: linux-install-locked
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.4
        with:
          version: 2026.10.19
          install: false
          cache: false
      - name: mise install --locked
        run: mise install --locked
      - name: installed hk version
        run: mise exec -- hk --version

  windows-bump-and-install:
    name: "3. Windows: mise upgrade --bump, then mise install (no --locked)"
    needs: windows-install-locked
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.4
        with:
          version: 2026.10.19
          install: false
          cache: false
      - name: mise upgrade --bump
        run: mise upgrade --bump
      - name: diff of mise.toml and mise.lock against the committed lock
        run: git diff -- mise.toml mise.lock
      - name: mise install
        run: mise install
      - name: installed hk version
        run: mise exec -- hk --version
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lock-bumped-on-windows
          path: |
            mise.toml
            mise.lock

  linux-install-windows-bumped-lock:
    name: "4. Linux: mise install --locked with the lock Windows bumped"
    needs: windows-bump-and-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: lock-bumped-on-windows
          path: .
      - name: stage the Windows-bumped files as the baseline
        run: git add mise.toml mise.lock
      - uses: jdx/mise-action@v5.2.4
        with:
          version: 2026.10.19
          install: false
          cache: false
      - name: mise install --locked
        run: mise install --locked
      - name: installed hk version
        if: ${{ !cancelled() }}
        run: mise exec -- hk --version
      - name: mise.toml and mise.lock unchanged by mise install
        if: ${{ !cancelled() }}
        run: git diff --exit-code -- mise.toml mise.lock
